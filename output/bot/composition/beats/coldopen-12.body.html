<style>
.co12 { position:absolute; inset:0; padding:var(--stage-pad-y) var(--stage-pad-x); display:flex; flex-direction:column; justify-content:center; gap:40px; }
.co12__kick { font-family:var(--font-mono); font-size:15px; letter-spacing:.3em; color:var(--text-mute); text-transform:uppercase; }
.co12__stage { position:relative; display:flex; align-items:stretch; gap:0; }
.co12__half { flex:1; padding:56px 48px; background:var(--surface-2); border:2px solid var(--rule); display:flex; flex-direction:column; gap:18px; }
.co12__half.right { border-left:0; }
.co12__lab { font-family:var(--font-mono); font-size:15px; letter-spacing:.24em; color:var(--text-mute); text-transform:uppercase; }
.co12__big { font-family:var(--font-display-cn); font-weight:700; font-size:52px; line-height:1.15; color:var(--text); }
.co12__big em { font-family:var(--font-mono); font-style:normal; color:var(--accent); font-size:44px; }
.co12__seam { position:absolute; left:50%; top:-28px; bottom:-28px; width:0; border-left:2px dashed var(--accent); }
.co12__seam span { position:absolute; top:50%; left:0; transform:translate(-50%,-50%); padding:10px 18px; background:var(--shell); border:2px solid var(--accent); font-family:var(--font-mono); font-size:14px; letter-spacing:.22em; color:var(--accent); text-transform:uppercase; white-space:nowrap; }
.co12__foot { display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:16px; letter-spacing:.16em; color:var(--text-mute); }
.co12__foot b { color:var(--accent); font-weight:500; }
</style>
<div class="co12">
  <div class="co12__kick">12 / 两半合起来才是团队</div>
  <div class="co12__stage">
    <div class="co12__half">
      <div class="co12__lab">推理</div>
      <div class="co12__big"><em>Opus 5.5</em><br />负责想清楚</div>
    </div>
    <div class="co12__seam"><span>缺一个都不成</span></div>
    <div class="co12__half right">
      <div class="co12__lab">执行</div>
      <div class="co12__big">持久环境<br />负责做下去</div>
    </div>
  </div>
  <div class="co12__foot"><span>推理 + 环境 = <b>一支小队</b></span><span>单有模型，只是零件</span></div>
</div>
