<style>
.co5 { position:absolute; inset:0; padding:var(--stage-pad-y) var(--stage-pad-x); display:flex; flex-direction:column; justify-content:center; gap:52px; }
.co5__kick { font-family:var(--font-mono); font-size:15px; letter-spacing:.3em; color:var(--text-mute); text-transform:uppercase; }
.co5__row { display:flex; align-items:center; gap:40px; }
.co5__avatar { width:132px; height:132px; display:grid; place-items:center; background:var(--surface-2); border:2px solid var(--rule); border-radius:50%; font-family:var(--font-mono); font-size:22px; letter-spacing:.16em; color:var(--text-2); }
.co5__name { font-family:var(--font-mono); font-size:22px; letter-spacing:.16em; color:var(--text); }
.co5__sub { margin-top:10px; font-family:var(--font-mono); font-size:15px; letter-spacing:.2em; color:var(--text-mute); text-transform:uppercase; }
.co5__input { display:flex; align-items:center; justify-content:space-between; gap:30px; padding:34px 40px; background:var(--surface-2); border:2px solid var(--rule); box-shadow:var(--card-shadow); }
.co5__text { font-family:var(--font-body); font-size:44px; color:var(--text); }
.co5__send { font-family:var(--font-mono); font-size:20px; letter-spacing:.2em; color:var(--accent); }
.co5__foot { font-family:var(--font-mono); font-size:16px; letter-spacing:.16em; color:var(--text-mute); }
</style>
<div class="co5">
  <div class="co5__kick">05 / 大多数人的第一次</div>
  <div class="co5__row">
    <div class="co5__avatar">BOT</div>
    <div>
      <div class="co5__name">Grok Bot</div>
      <div class="co5__sub">一个窗口，一个提示词</div>
    </div>
  </div>
  <div class="co5__input">
    <span class="co5__text">做个应用</span>
    <span class="co5__send">发送 ▸</span>
  </div>
  <div class="co5__foot">丢一句话进去，然后等它表演</div>
</div>
